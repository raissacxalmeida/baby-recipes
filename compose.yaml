services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: baby
      POSTGRES_DB: babyrecipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby -d babyrecipes"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://baby:${POSTGRES_PASSWORD}@db:5432/babyrecipes
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "3000"

volumes:
  pgdata:
